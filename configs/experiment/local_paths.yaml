# @package _global_
# =============================================================================
# Experiment overlay — model_dir for local (non-Docker) runs.
#
# configs/config.yaml ships model_dir: model, i.e. the LLM weights sitting
# flat under model/. inference.py (untouched, upstream) instead expects the
# nested layout it hardcodes for the Grand Challenge container:
#
#     /opt/ml/model/gemma-4-E2B-it/
#     /opt/ml/model/embedding_model/
#
# ...and overrides paths.model_dir unconditionally at runtime (inference.py
# ~L368), so config.yaml's default is irrelevant there — it only matters for
# `make run` outside Docker. This overlay reproduces the same nested layout
# for local development without editing config.yaml itself.
#
#     make run RUN_ARGS="+experiment=local_paths agent.tasks=[1] agent.limit=2"
#
# Prerequisite: model/ organised as
#     model/gemma-4-E2B-it/    <- snapshot_download('google/gemma-4-E2B-it', ...)
#     model/embedding_model/   <- make fetch-embedding-model, moved here
# =============================================================================

paths:
  model_dir: model/gemma-4-E2B-it
