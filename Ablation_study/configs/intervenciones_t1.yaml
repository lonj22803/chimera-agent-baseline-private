# Los pseudonodos son parte de la representacion compilada de LangGraph, no
# intervenciones del agente. El resto de elementos estructurales se registra en 1.2.
estructural:
  - id: N01
    nombre: INTAKE
    nodos_grafo: []
    por_que: Es la entrada obligatoria del expediente y retirarla dejaria al grafo sin caso clinico.
  - id: M7
    nombre: Precedente identico
    nodos_grafo: []
    por_que: Esta apagado en la entrega y solo se conserva como referencia de techo dentro de muestra.
  - id: G4
    nombre: Parte clinico en lugar del acta
    nodos_grafo: []
    por_que: Ya existe evidencia previa de su efecto y repetirla responderia otra vez la misma comparacion.
  - id: G5
    nombre: Restriccion de herramientas sin plan
    nodos_grafo: []
    por_que: Solo actua con un plan vacio; en A0 se registra su frecuencia en vez de retirarla.
  - id: G7
    nombre: Empujones de uso de herramientas
    nodos_grafo: []
    por_que: Es control de flujo; sus activaciones se cuentan en L0 sin crear un brazo adicional.
  - id: D-OPERATIVA
    nombre: Capa operativa y perfil de entrega
    nodos_grafo: []
    por_que: Supervisor, sombra, warmup, deadline, serial_predict, perfil 16 GB y cache sostienen el limite de 15 minutos.
  - id: D-RASGOS
    nombre: Bloques internos de rasgos de E1, E3 y E4
    nodos_grafo: []
    por_que: Ya fueron medidos por el estudio de expertos; este estudio ablaciona intervenciones del agente.
  - id: D-PROMPTS
    nombre: Prompts de redaccion
    nodos_grafo: []
    por_que: Su ablacion estudiaria calidad de prosa; aqui solo se consideran mediante las guardias G1-G3.
  - id: D-CONTRATO
    nombre: Esquema, reveal_sequence y validacion
    nodos_grafo: []
    por_que: Forman el contrato de salida del reto y retirarlos haria incomparable la entrega.
  - id: GRAPH_START
    nombre: Inicio de LangGraph
    nodos_grafo: [__start__]
    por_que: Pseudonodo de entrada creado por LangGraph.
  - id: GRAPH_END
    nombre: Fin de LangGraph
    nodos_grafo: [__end__]
    por_que: Pseudonodo de salida creado por LangGraph.
